generated: '2026-08-12'
method: searched
source: >-
  https://developer.domob.cn/#/doc/api, https://dev.domob.cn/help/techdocument.htm,
  https://dev.domob.cn/developers/SDKdownload.htm,
  https://github.com/domob-inc/reporting_api, plus DNS/HTTP probes on 2026-08-12
summary: >-
  Domob publishes no versioning policy, no deprecation policy, no Sunset/
  Deprecation header support, no SLA and no status page. The strongest lifecycle
  evidence available is negative: an API that Domob's own help centre still
  documents today points at a host that no longer resolves, and the SDK
  downloads that same help centre serves were last updated between 2014 and 2018.
versioning_policy:
  published: false
  scheme: mixed — path prefix on the retired API, document-date on the live API
  detail: >-
    /api/ -> /api_v2/ on the Reporting API; the Media Data API is identified only
    by "新-20241101" in its document title. No version header, no version field,
    no way for a client to detect the served revision.
deprecation_policy:
  published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  notice_period: none
  detail: >-
    No deprecation policy exists on any Domob surface, and no RFC 8594 Sunset or
    Deprecation header was observed. The Reporting API was withdrawn without any
    published notice — its documentation is still live while its host is gone.
    Because Domob publishes no deprecation policy, NO `Deprecation` pointer is
    emitted in apis.yml.
sla:
  published: false
  detail: >-
    The service agreement (https://dev.domob.cn/help/rule.htm) explicitly
    DISCLAIMS availability: "本平台不保证服务一定能满足用户的要求，也不保证服务不会中断，
    对服务的及时性、安全性、准确性也都不作保证" — the platform does not guarantee that
    service will be uninterrupted, nor guarantee timeliness, security or accuracy.
    That is an anti-SLA, published in the terms.
status_page:
  published: false
  probed:
    - url: https://status.domob.cn
      status: null
      note: does not resolve (no DNS answer)
  detail: >-
    No status page, no incident history and no uptime feed on any Domob host.
    NO `StatusPage` pointer is emitted in apis.yml.
