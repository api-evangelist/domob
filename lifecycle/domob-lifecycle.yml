    withdrawal_notice: none
    note: >-
      Recorded as retired rather than as a live API. No OpenAPI was generated for
      it: writing a spec for a dead host would manufacture callable-looking
      evidence for a surface that cannot be called.
  - api: domob-open-api
    state: live-undocumented
    evidence:
      - >-
        https://open.domob.cn/ returned HTTP 200 with {"page":"Domob Open API"}
        on 2026-08-12 and answers unrouted paths with
        {"error_code":"10103","error_description":"request api not found"}.
    note: >-
      A live, self-identified API gateway with no discoverable documentation,
      no listing on the developer platform, and no operations we can name. Not
      registered as an API entry because nothing about its contract is published.
sdk_lifecycle:
  detail: >-
    The download page Domob still serves (https://dev.domob.cn/developers/SDKdownload.htm)
    offers builds whose most recent update is 2018-08-09; the core Android ad SDK
    build linked there is 4.5.4 from 2015-05-21. The GitHub sample repositories
    were last pushed in 2015. Meanwhile the developer platform's own SDK
    documentation page lists current SDK docs at 2.2.1 (Android, 2025-08-14) and
    2.3.4 (iOS, 2025-09-22) — a different, newer SDK line whose binaries are not
    published on the download page. Two SDK generations are advertised
    simultaneously with no migration note.
  see: packages/domob-packages.yml
support:
