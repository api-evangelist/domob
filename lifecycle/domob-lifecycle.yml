  - api: domob-reporting-api
    state: retired
    last_documented_version: 1.0.3
    evidence:
      - >-
        Still published today at https://dev.domob.cn/help/techdocument.htm
        (section "Reporting API for Publishers v.1.0.2") and at
        https://github.com/domob-inc/reporting_api (v1.0.3).
      - >-
        Its documented host dvx.domob.cn returns NXDOMAIN (verified against
