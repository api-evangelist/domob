method: searched
source: >-
  https://github.com/Domob-SDK, https://github.com/domob-inc,
  https://dev.domob.cn/developers/SDKdownload.htm,
  https://developer.domob.cn/#/doc/sdkWord, and registry lookups against
  registry.npmjs.org, pypi.org, rubygems.org, crates.io on 2026-08-12
notes: >-
  Domob (多盟) distributes its mobile advertising integration as first-party iOS
  and Android ad SDKs, plus game-engine plugins (Unity3D, Cocos2d-x) and an
  Offerwall SDK. NOTHING IS PUBLISHED TO A PACKAGE REGISTRY. There is no npm,
  PyPI, Maven Central, CocoaPods, RubyGems or crates.io entry under a Domob
  namespace — confirmed 2026-08-12 (registry.npmjs.org/domob 404,
  pypi.org/pypi/domob/json 404, rubygems.org/api/v1/gems/domob.json 404,
  crates.io/api/v1/crates/domob 404). Distribution is by zip download from
  Domob's CDN (s.domob.cn) and by GitHub repository.

  CURRENCY IS THE STORY HERE. Every distribution channel Domob still serves is
  stale: the newest CDN build is 2018-08-09, the core Android ad SDK build on
  the download page is 4.5.4 from 2015-05-21, and every GitHub sample repository
  was last pushed between 2014 and 2018. The developer platform simultaneously
  advertises a DIFFERENT, newer SDK line (Android 2.2.1 dated 2025-08-14, iOS
  2.3.4 dated 2025-09-22) whose binaries are NOT published on the download page
  and whose documentation is on a login-gated Feishu wiki — so the current SDK
  is not publicly obtainable, and the publicly obtainable SDK is 8-11 years old.

  `version: null` on a GitHub-source entry means the repository publishes no
  tags or releases; `published:` on those entries records the last push date,
  which is the only dated signal available.
current_sdk_line:
  note: >-
    Listed on the Domob developer platform's SDK documentation page. Binaries are
    not publicly downloadable and the docs sit behind a BlueFocus Feishu login,
    so these are version facts read from the platform's own document table, not
    packages we could retrieve.
