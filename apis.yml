- name: Domob ADX
  description: >-
    Domob's mobile ad exchange, supporting RTB, PMP, PD and PDB buying. Listed on the Domob developer
    platform's API docking page with a docking document updated 2025-06-13, but that document is hosted
    on a BlueFocus Feishu wiki that redirects to an SSO login, so the contract could not be read. The
    exchange host answers HTTP 401 to an anonymous request, confirming the surface is live and gated rather
    than absent.
