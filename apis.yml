name: domob
description: >-
  Domob (多盟) is a Beijing-based mobile intelligent marketing and advertising
  technology company founded in September 2010, positioned as one of China's
  early smartphone advertising DSP and mobile ad-network platforms. It provides
  data-technology and content services spanning programmatic buying (DSP), the
  UGdesk user-growth platform, the BidMaster preferred buying platform, and the
  BlueNova traffic-monetization platform, alongside agency and short-video
  services partnered with ByteDance, Tencent, Kuaishou, Microsoft Advertising
  and Xiaohongshu. For developers and app publishers, Domob distributes
  first-party iOS and Android ad SDKs (banner, interstitial, splash, native and
  offerwall formats) plus Unity3D and Cocos2d-x game-engine plugins via its
  Domob-SDK GitHub organization; publishers obtain a Publisher ID and Placement
  ID from the Domob platform to monetize apps. In 2025 the Domob SDK passed
  CAICT dual-end (iOS/Android) security certification. This profile was surfaced
  as a portfolio company of Qiming Venture Partners and enriched from public
  sources.
