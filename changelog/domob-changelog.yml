summary: >-
  Domob maintains no unified, dated API changelog. What exists is fragmented:
  a hand-written version list inside the (retired) Reporting API document, five
  per-SDK changelog pages on the legacy developer site, and bare "updateDate"
  columns on the current developer platform's document tables. Nothing is dated
  more recently than 2025 for docs and 2018 for SDK builds.
scheme: per-document, hand-maintained
unified_changelog: false
feed: null
api_changelogs:
  - api: domob-reporting-api
    current_version: 1.0.3
    status: retired-host
    source: https://github.com/domob-inc/reporting_api
    note: >-
      The GitHub copy (v1.0.3) is one revision AHEAD of the copy Domob still
      serves on its own help centre (v1.0.2) — the provider's own two published
      copies disagree.
    entries:
      - version: 1.0.3
        date: null
        breaking: false
        additions:
          - >-
            Added the `region` request parameter. `region=all` returns one row
            per country/region; an ISO 3166-1 alpha-2 code returns a single region.
        highlights: Country/region breakdown for media statistics.
      - version: 1.0.2
        date: null
        breaking: true
        additions:
          - >-
            Added optional `cur=usd` query parameter to report revenue in USD
            (daily reference rate, explicitly not the settlement rate). Default
            remains RMB.
          - >-
            Added a v2 reporting path — revenue unit changed from *1000000 to *1,
            served at /api_v2/applications instead of /api/applications.
        highlights: >-
          The revenue-unit change is breaking, and Domob shipped it as a NEW PATH
          rather than mutating v1 — a versioning decision worth crediting even
          though the API is now dead.
      - version: 1.0.1
        date: null
        breaking: false
        additions:
          - Added `hr` section support for hour-level time selection.
  - api: domob-media-data-api
    current_version: '2024-11-01'
    status: current
    source: https://developer.domob.cn/#/doc/api
    note: >-
      No changelog is published for this API. The only version signal is the
      document title ("媒体数据API接口（新-20241101）") and the updateDate column on the
      developer platform's document table.
    entries:
      - version: '2024-11-01'
        date: '2024-11-01'
        breaking: unknown
        highlights: >-
          Current published revision of the Media Data API document. The prior
          revision is not published, so no diff is possible.
  - api: domob-adx
    current_version: null
    status: current
    source: https://developer.domob.cn/#/doc/api
    entries:
      - version: null
        date: '2025-06-13'
        breaking: unknown
        highlights: >-
          Most recent updateDate on the Domob ADX docking document. Content is
          behind a BlueFocus Feishu SSO login and could not be read.
