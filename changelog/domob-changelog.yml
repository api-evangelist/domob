findings:
  - id: no-unified-changelog
    detail: >-
      There is no single page, feed or endpoint where an integrator can see what
      changed across Domob's APIs.
  - id: provider-copies-disagree
    detail: >-
      Reporting API v1.0.3 on GitHub vs v1.0.2 on domob.cn — the provider serves
      two different versions of the same document.
  - id: changelog-entries-undated
    detail: >-
      The Reporting API version list has version numbers but no dates, so decay
      cannot be measured from it.
